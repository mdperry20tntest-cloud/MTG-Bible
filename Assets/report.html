<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
{{CSS}}
  </style>
</head>
<body>
<div class='page'>
  <header class='banner'>
    <div class='pips'><span class='pip pip-w'></span><span class='pip pip-u'></span><span class='pip pip-b'></span><span class='pip pip-r'></span><span class='pip pip-g'></span></div>
    <h1>{{TITLE}}</h1>
    <div class='divider'><span></span></div>
  </header>
  <main class='card-frame'><div class='frame-inner'>
    {{WARNINGS}}
    <div class='search-row'>
      <input type='text' id='searchInput' class='search-box' onsearch='onSearchChange()' onkeyup='onSearchChange()'>
      <button type='button' class='clear-btn' onclick='clearSearch()'>Clear</button>
      <button type='button' class='export-btn' onclick='exportToExcel()'>Export to Excel</button>
      <button type='button' class='export-btn' onclick='refreshData()'>Refresh data</button>
    </div>
    <div id='totals' class='totals'></div>
    <details id='historyPanel' class='history-panel'><summary><span>Collection value over time</span><span id='historyDelta' class='history-delta'></span></summary><div id='historyRanges' class='history-ranges'><button type='button' class='range-btn' data-range='1' onclick='setHistoryRange(1)'>1M</button><button type='button' class='range-btn' data-range='3' onclick='setHistoryRange(3)'>3M</button><button type='button' class='range-btn' data-range='6' onclick='setHistoryRange(6)'>6M</button><button type='button' class='range-btn' data-range='12' onclick='setHistoryRange(12)'>1Y</button><button type='button' class='range-btn active' data-range='all' onclick="setHistoryRange('all')">All</button></div><div id='historyChart'></div></details>
    <div class='table-wrap'><table id='reportTable'>
      <thead><tr id='headerRow'></tr></thead>
      <tbody id='tableBody'></tbody>
    </table></div>
    <div class='footer-row'>
      <div id='paginationControls' class='pagination-container'></div>
      <label>Rows per page <select id='pageSize' onchange='onPageSizeChange()'><option>10</option><option>25</option><option>50</option><option selected>100</option></select></label>
      <span id='pageInfo'></span>
    </div>
  </div></main>
  <footer class='fine-print'>{{FOOTER}}</footer>
</div>
<script>
{{DATA}}
{{JS}}
</script>
</body>
</html>
