<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
{{CSS}}
  </style>
</head>
<body>
<div class='page'>
  <header class="tcg-banner">
    <div class="tcg-banner__art" role="img" aria-label="Ancient Tomb card art"></div>
    <div class="tcg-banner__text">
      <p class="tcg-banner__title">{{TITLE}}</p>
      <p class="tcg-banner__sub">My Magic: The Gathering collection</p>
    </div>
    <!-- Update the artist if you switch printings (eos/136 is Meel Tamphanon, eos/91 is Bruce Brenneise) -->
    <span class="tcg-banner__credit">Art: Meel Tamphanon · Magic: The Gathering © Wizards of the Coast · Image via Scryfall</span>
  </header>
  <main class='card-frame'><div class='frame-inner'>
    {{WARNINGS}}
    <div class='search-row'>
      <input type='text' id='searchInput' class='search-box' onsearch='onSearchChange()' onkeyup='onSearchChange()'>
      <button type='button' class='clear-btn' onclick='clearSearch()'>Clear</button>
      <button type='button' class='export-btn' onclick='exportToExcel()'>Export to Excel</button>
      <button type='button' class='export-btn' onclick='refreshData()'>Refresh data</button>
      <button type='button' class='export-btn' onclick='refreshMissingData()' title='Re-download the cards in your sets from Scryfall to update the missing cards list and prices'>Refresh missing data</button>
      <label id='viewToggle' class='view-toggle'><input type='checkbox' id='missingToggle' onchange='onViewChange()'> Show missing cards <span id='missingCount'></span></label>
    </div>
    <div id='viewNote' class='view-note' style='display:none'></div>
    <div id='totals' class='totals'></div>
    <details id='setPanel' class='set-panel' open style='display:none'><summary id='setSummary'>Set completion</summary><div id='setProgress' class='set-progress'></div></details>
    <details id='historyPanel' class='history-panel'><summary><span>Collection value over time</span><span id='historyDelta' class='history-delta'></span></summary><div id='historyChart'></div></details>
    <div class='table-wrap'><table id='reportTable'>
      <thead><tr id='headerRow'></tr></thead>
      <tbody id='tableBody'></tbody>
    </table></div>
    <div class='footer-row'>
      <div id='paginationControls' class='pagination-container'></div>
      <label>Rows per page <select id='pageSize' onchange='onPageSizeChange()'><option>10</option><option>25</option><option>50</option><option selected>100</option></select></label>
      <span id='pageInfo'></span>
    </div>
  </div></main>
  <footer class='fine-print'>{{FOOTER}}</footer>
</div>
<script>
{{DATA}}
{{JS}}
</script>
</body>
</html>
