<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCG Bible banner</title>
<style>
  body { margin: 0; background: #14121c; }

  /* ---- Banner: copy everything from here to the closing </header> into your site ---- */
  .tcg-banner {
    /* To show a different band of the art, change the 45% in .tcg-banner__art (0% = top, 100% = bottom).
       To use another printing: change the set code/number, e.g. eos/91 or ltc/357.
       Or save the art crop from Scryfall next to this file and use url("ancient-tomb.jpg"). */
    --art: url("https://api.scryfall.com/cards/eos/136?format=image&version=art_crop");
    --ink: #14121c;
    --gold: #c9a24a;

    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 10 / 1;
    min-height: 64px;
    overflow: hidden;
    background: var(--ink);
    border-bottom: 4px solid var(--gold);
    font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
  }
  .tcg-banner__art {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 66%;
    background: var(--art) center 45% / cover no-repeat;
    /* soft, eased fade of the art into the background (stops follow a smooth curve).
       For a longer/softer fade, widen the art (width above); for a shorter one, pull the later stops closer. */
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.03) 8%, rgba(0,0,0,.10) 16%,
      rgba(0,0,0,.20) 24%, rgba(0,0,0,.32) 32%, rgba(0,0,0,.45) 40%, rgba(0,0,0,.58) 48%,
      rgba(0,0,0,.70) 56%, rgba(0,0,0,.80) 64%, rgba(0,0,0,.88) 72%, rgba(0,0,0,.94) 80%,
      rgba(0,0,0,.98) 90%, #000 100%);
            mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.03) 8%, rgba(0,0,0,.10) 16%,
      rgba(0,0,0,.20) 24%, rgba(0,0,0,.32) 32%, rgba(0,0,0,.45) 40%, rgba(0,0,0,.58) 48%,
      rgba(0,0,0,.70) 56%, rgba(0,0,0,.80) 64%, rgba(0,0,0,.88) 72%, rgba(0,0,0,.94) 80%,
      rgba(0,0,0,.98) 90%, #000 100%);
  }
  .tcg-banner__art::before {      /* optional galaxy-foil shimmer: delete this block to remove */
    content: "";
    position: absolute;
    inset: 0;
    opacity: .5;
    mix-blend-mode: screen;
    background:
      linear-gradient(115deg, transparent 30%, rgba(110,170,255,.16) 45%, rgba(225,120,255,.16) 55%, transparent 70%),
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 70px 95px, #bfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 130px 50px, #f0d0ff, transparent),
      radial-gradient(1px 1px at 160px 125px, #fff, transparent);
    background-size: 100% 100%, 180px 150px, 180px 150px, 180px 150px, 180px 150px;
  }
  .tcg-banner__text {
    position: relative;
    z-index: 1;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 5cqw;
  }
  .tcg-banner__title {
    margin: 0;
    font-size: clamp(20px, 3.4cqw, 56px);
    font-weight: 700;
    line-height: 1.05;
    color: #efe6d0;
    text-shadow: 0 2px 14px rgba(0,0,0,.6);
  }
  .tcg-banner__sub {
    margin: .3em 0 0;
    font-size: clamp(11px, 1.1cqw, 18px);
    font-style: italic;
    color: #c4bcd3;
  }
  .tcg-banner__credit {
    position: absolute;
    z-index: 1;
    right: 12px; bottom: 6px;
    max-width: 55%;
    text-align: right;
    font: clamp(9px, .8cqw, 12px) / 1.3 Arial, sans-serif;
    color: rgba(255,255,255,.7);
    text-shadow: 0 1px 3px #000;
  }
</style>
</head>
<body>

<header class="tcg-banner">
  <div class="tcg-banner__art" role="img" aria-label="Ancient Tomb card art"></div>
  <div class="tcg-banner__text">
    <p class="tcg-banner__title">TCG Bible</p>
    <p class="tcg-banner__sub">My Magic: The Gathering collection</p>
  </div>
  <!-- Update the artist if you switch printings (eos/136 is Meel Tamphanon, eos/91 is Bruce Brenneise) -->
  <span class="tcg-banner__credit">Art: Meel Tamphanon · Magic: The Gathering © Wizards of the Coast · Image via Scryfall</span>
</header>

</body>
</html>
